{% extends 'base.html' %}

{% block title %}Tizimga Kirish - G'ulomte Mahalla{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 p-4 relative overflow-hidden">
    
    <!-- Decorative Glowing Shapes -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-blue-400 text-white font-bold text-2xl shadow-xl shadow-indigo-500/30 mb-4 transform hover:scale-105 transition-transform">
                <i class="fa-solid fa-building-columns"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">G'ulomte Mahalla</h1>
            <p class="text-sm text-indigo-200/80 mt-1">Boshqaruv tizimiga xush kelibsiz</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/20">
            
            <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center space-x-2">
                <i class="fa-solid fa-right-to-bracket text-indigo-600"></i>
                <span>Tizimga Kirish</span>
            </h2>

            <form id="login-form" class="space-y-5">
                
                <!-- Username Input -->
                <div>
                    <label for="username" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
                        Foydalanuvchi nomi (Username)
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <input type="text" id="username" name="username" required autocomplete="username"
                            placeholder="username kiriting"
                            class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
                        Parol
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            placeholder="••••••••"
                            class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i class="fa-solid fa-eye text-sm" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Error Container -->
                <div id="login-error" class="hidden p-3.5 rounded-xl bg-rose-50 border border-rose-100 text-rose-600 text-xs font-medium flex items-center space-x-2">
                    <i class="fa-solid fa-triangle-exclamation text-base flex-shrink-0"></i>
                    <span id="login-error-text"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="login-btn"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-500/25 transition transform active:scale-95 flex items-center justify-center space-x-2">
                    <span id="btn-text">Kirish</span>
                    <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden text-base"></i>
                </button>

            </form>

        </div>

        <p class="text-center text-xs text-indigo-200/60 mt-8">
            &copy; 2026 G'ulomte Mahalla Portali
        </p>

    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Password toggle
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });
    }

    // Login Form Submit
    const form = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorBox = document.getElementById('login-error');
    const errorText = document.getElementById('login-error-text');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        errorBox.classList.add('hidden');
        btnText.textContent = 'Kirilmoqda...';
        btnSpinner.classList.remove('hidden');
        loginBtn.disabled = true;

        const username = document.getElementById('username').value.trim();
        const password = pwdInput.value;

        try {
            const response = await API.login(username, password);
            Toast.success('Tizimga muvaffaqiyatli kirdingiz!');
            setTimeout(() => {
                window.location.href = '/dashboard/';
            }, 600);
        } catch (err) {
            errorText.textContent = err.message || 'Foydalanuvchi nomi yoki parol noto\'g\'ri!';
            errorBox.classList.remove('hidden');
            btnText.textContent = 'Kirish';
            btnSpinner.classList.add('hidden');
            loginBtn.disabled = false;
        }
    });
});
</script>
{% endblock %}
