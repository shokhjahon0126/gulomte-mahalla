{% extends 'base.html' %}

{% block title %}Yangilik Tafsilotlari - G'ulomte Mahalla{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <!-- Header Navigation -->
    <div class="flex items-center justify-between">
        <a href="/news/" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition inline-flex items-center space-x-1.5">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Yangiliklar Ro'yxatiga Qaytish</span>
        </a>

        <!-- Admin Controls -->
        <div id="admin-actions" class="admin-only hidden flex items-center space-x-2">
            <a id="edit-link" href="#" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow-md transition inline-flex items-center space-x-1.5">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>Tahrirlash</span>
            </a>
            <button id="delete-btn" type="button" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow-md transition inline-flex items-center space-x-1.5">
                <i class="fa-solid fa-trash-can"></i>
                <span>O'chirish</span>
            </button>
        </div>
    </div>

    <!-- Article Detail Card -->
    <div id="news-card" class="bg-white rounded-3xl border border-gray-200/80 shadow-xs p-6 sm:p-10 space-y-6">
        
        <!-- Skeleton Loading -->
        <div id="loading-spinner" class="py-16 text-center text-gray-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600 mb-3"></i>
            <p class="text-sm font-medium">Yangilik ma'lumotlari yuklanmoqda...</p>
        </div>

        <div id="news-content" class="hidden space-y-6">
            
            <div class="space-y-3 pb-6 border-b border-gray-100">
                <div class="flex items-center space-x-3 text-xs text-indigo-600 font-semibold">
                    <span class="px-2.5 py-1 bg-indigo-50 rounded-lg">Yangilik</span>
                    <span id="news-date" class="text-gray-500">...</span>
                </div>
                <h1 id="news-title" class="text-2xl sm:text-3xl font-extrabold text-gray-900 leading-tight">
                    ...
                </h1>
            </div>

            <!-- Description Body -->
            <div id="news-description" class="text-gray-700 text-base leading-relaxed whitespace-pre-line space-y-4">
                ...
            </div>

        </div>

    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
let currentNewsItem = null;

document.addEventListener('DOMContentLoaded', async function() {
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const newsId = pathParts[1]; // /news/<id>/

    if (!newsId) {
        window.location.href = '/news/';
        return;
    }

    try {
        currentNewsItem = await API.news.getById(newsId);
        
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('news-content').classList.remove('hidden');

        document.getElementById('news-title').textContent = currentNewsItem.title;
        document.getElementById('news-description').textContent = currentNewsItem.description;

        if (currentNewsItem.created_at) {
            document.getElementById('news-date').textContent = DateUtils.formatDateTime(currentNewsItem.created_at);
        }

        // Setup Admin buttons
        const editLink = document.getElementById('edit-link');
        const deleteBtn = document.getElementById('delete-btn');
        if (editLink) editLink.href = `/news/${currentNewsItem.id}/edit/`;
        if (deleteBtn) {
            deleteBtn.onclick = () => showDeleteConfirmation(currentNewsItem.id, currentNewsItem.title);
        }

    } catch (err) {
        Toast.error(err.message || "Yangilik topilmadi!");
        setTimeout(() => {
            window.location.href = '/news/';
        }, 1500);
    }
});

function showDeleteConfirmation(id, title) {
    const html = `
        <div class="text-center space-y-4 p-2">
            <div class="w-14 h-14 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <div>
                <h4 class="text-lg font-bold text-gray-900">Bu yangilikni o'chirishni xohlaysizmi?</h4>
                <p class="text-xs text-gray-500 mt-1 max-w-sm mx-auto">"${escapeHtml(title)}" nomli yangilik ma'lumotlar bazasidan butunlay o'chiriladi.</p>
            </div>
        </div>
    `;

    const footerHtml = `
        <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50">Bekor qilish</button>
        <button type="button" id="modal-confirm-delete-btn" onclick="executeDeleteFromDetail(${id})" class="px-4 py-2 text-xs font-semibold text-white bg-rose-600 hover:bg-rose-700 rounded-xl shadow-md shadow-rose-500/20">O'chirish</button>
    `;

    openModal("Yangilikni O'chirish", html, footerHtml);
}

async function executeDeleteFromDetail(id) {
    const modalBtn = document.getElementById('modal-confirm-delete-btn');
    const deleteBtn = document.getElementById('delete-btn');

    if (modalBtn) {
        modalBtn.disabled = true;
        modalBtn.textContent = "O'chirilmoqda...";
    }
    if (deleteBtn) deleteBtn.disabled = true;

    try {
        await API.news.delete(id);
        Toast.success("Yangilik muvaffaqiyatli o'chirildi!");
        closeModal();
        setTimeout(() => {
            window.location.href = '/news/';
        }, 500);

    } catch (err) {
        Toast.error(err.message || "O'chirishda xatolik yuz berdi!");
        if (modalBtn) {
            modalBtn.disabled = false;
            modalBtn.textContent = "O'chirish";
        }
        if (deleteBtn) deleteBtn.disabled = false;
    }
}

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
}
</script>
{% endblock %}
