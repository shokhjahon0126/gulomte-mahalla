{% extends 'base.html' %}

{% block title %}<span id="page-title-text">Yangi Yangilik Qo'shish</span> - G'ulomte Mahalla{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <!-- Header Navigation -->
    <div class="flex items-center justify-between">
        <div>
            <h1 id="form-heading" class="text-2xl font-extrabold text-gray-900 tracking-tight">Yangi Yangilik Qo'shish</h1>
            <p id="form-subheading" class="text-xs text-gray-500">Mahalla yangiligi uchun sarlavha va matn kiriting</p>
        </div>
        <a href="/news/" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition inline-flex items-center space-x-1.5">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Orqaga</span>
        </a>
    </div>

    <!-- Form Card -->
    <div class="bg-white rounded-3xl border border-gray-200/80 shadow-xs p-6 sm:p-8">
        
        <form id="news-form" class="space-y-6">
            
            <!-- Title -->
            <div>
                <label for="news-title-input" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
                    Yangilik Sarlavhasi (Title)
                </label>
                <input type="text" id="news-title-input" name="title" required
                    placeholder="Masalan: Mahalla hududida obodonlashtirish ishlari boshlandi"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>

            <!-- Description -->
            <div>
                <label for="news-desc-input" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
                    Batafsil Matn / Tavsif (Description)
                </label>
                <textarea id="news-desc-input" name="description" rows="8" required
                    placeholder="Yangilik haqida batafsil ma'lumot kiriting..."
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition resize-y"></textarea>
            </div>

            <!-- Error Container -->
            <div id="form-error" class="hidden p-4 rounded-xl bg-rose-50 border border-rose-100 text-rose-600 text-xs font-medium"></div>

            <!-- Form Actions -->
            <div class="pt-4 border-t border-gray-100 flex items-center justify-end space-x-3">
                <a href="/news/" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition">
                    Bekor qilish
                </a>
                <button type="submit" id="submit-news-btn" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md shadow-indigo-500/20 transition flex items-center space-x-2">
                    <span id="btn-text">Saqlash</span>
                    <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>
            </div>

        </form>

    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async function() {
    const path = window.location.pathname;
    const isEditMode = path.includes('/edit');
    const pathParts = path.split('/').filter(Boolean);
    const newsId = isEditMode ? pathParts[1] : null;

    const titleInput = document.getElementById('news-title-input');
    const descInput = document.getElementById('news-desc-input');
    const formHeading = document.getElementById('form-heading');
    const formSubheading = document.getElementById('form-subheading');
    const submitBtn = document.getElementById('submit-news-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorBox = document.getElementById('form-error');

    if (isEditMode && newsId) {
        formHeading.textContent = "Yangilikni Tahrirlash";
        formSubheading.textContent = "Yangilik sarlavhasi va matnini o'zgartiring";
        btnText.textContent = "O'zgarishlarni Saqlash";

        try {
            const item = await API.news.getById(newsId);
            titleInput.value = item.title || '';
            descInput.value = item.description || '';
        } catch (e) {
            Toast.error("Yangilik ma'lumotlarini yuklashda xatolik!");
            setTimeout(() => window.location.href = '/news/', 1500);
        }
    }

    const form = document.getElementById('news-form');
    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        errorBox.classList.add('hidden');
        btnText.textContent = isEditMode ? 'Saqlanmoqda...' : 'Yaratilmoqda...';
        btnSpinner.classList.remove('hidden');
        submitBtn.disabled = true;

        const payload = {
            title: titleInput.value.trim(),
            description: descInput.value.trim(),
        };

        try {
            if (isEditMode) {
                await API.news.update(newsId, payload);
                Toast.success("Yangilik muvaffaqiyatli yangilandi!");
            } else {
                await API.news.create(payload);
                Toast.success("Yangi yangilik qo'shildi!");
            }

            setTimeout(() => {
                window.location.href = '/news/';
            }, 600);

        } catch (err) {
            errorBox.textContent = err.message || "Xatolik yuz berdi!";
            errorBox.classList.remove('hidden');
            btnText.textContent = isEditMode ? "O'zgarishlarni Saqlash" : "Saqlash";
            btnSpinner.classList.add('hidden');
            submitBtn.disabled = false;
        }
    });
});
</script>
{% endblock %}
