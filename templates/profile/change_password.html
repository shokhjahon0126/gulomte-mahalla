{% extends 'base.html' %}

{% block title %}Parolni O'zgartirish - G'ulomte Mahalla{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Parolni O'zgartirish</h1>
            <p class="text-xs text-gray-500">Xavfsizlik uchun yangi parol o'rnating</p>
        </div>
        <a href="/profile/" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition inline-flex items-center space-x-1.5">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Orqaga</span>
        </a>
    </div>

    <!-- Password Change Card -->
    <div class="bg-white rounded-3xl border border-gray-200/80 shadow-xs p-6 sm:p-8">
        
        <form id="change-password-form" class="space-y-6">
            
            <!-- New Password -->
            <div>
                <label for="new_password" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
                    Yangi Parol
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-key text-sm"></i>
                    </div>
                    <input type="password" id="new_password" name="new_password" required
                        placeholder="Yangi parolni kiriting"
                        class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    <button type="button" class="pwd-toggle absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600" data-target="new_password">
                        <i class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm New Password -->
            <div>
                <label for="confirm_new_password" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
                    Yangi Parolni Tasdiqlang
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </div>
                    <input type="password" id="confirm_new_password" name="confirm_new_password" required
                        placeholder="Yangi parolni qayta kiriting"
                        class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    <button type="button" class="pwd-toggle absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600" data-target="confirm_new_password">
                        <i class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Error Box -->
            <div id="pwd-error" class="hidden p-4 rounded-xl bg-rose-50 border border-rose-100 text-rose-600 text-xs font-medium"></div>

            <!-- Submit Buttons -->
            <div class="pt-4 border-t border-gray-100 flex items-center justify-end space-x-3">
                <a href="/profile/" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition">
                    Bekor qilish
                </a>
                <button type="submit" id="change-pwd-btn" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md shadow-indigo-500/20 transition flex items-center space-x-2">
                    <span id="btn-text">Parolni Yangilash</span>
                    <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>
            </div>

        </form>

    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Password visibility toggles
    const toggles = document.querySelectorAll('.pwd-toggle');
    toggles.forEach(btn => {
        btn.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    });

    const form = document.getElementById('change-password-form');
    const newPwdInput = document.getElementById('new_password');
    const confirmPwdInput = document.getElementById('confirm_new_password');
    const submitBtn = document.getElementById('change-pwd-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorBox = document.getElementById('pwd-error');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        errorBox.classList.add('hidden');
        
        const newPwd = newPwdInput.value;
        const confirmPwd = confirmPwdInput.value;

        if (newPwd !== confirmPwd) {
            errorBox.textContent = "Yangi parol va tasdiqlash paroli bir-biriga mos kelmadi!";
            errorBox.classList.remove('hidden');
            return;
        }

        btnText.textContent = 'Yangilanmoqda...';
        btnSpinner.classList.remove('hidden');
        submitBtn.disabled = true;

        try {
            await API.changePassword(newPwd, confirmPwd);
            Toast.success('Parolingiz muvaffaqiyatli yangilandi!');
            form.reset();
            setTimeout(() => {
                window.location.href = '/profile/';
            }, 800);
        } catch (err) {
            errorBox.textContent = err.message || 'Parolni o\'zgartirishda xatolik yuz berdi!';
            errorBox.classList.remove('hidden');
            btnText.textContent = 'Parolni Yangilash';
            btnSpinner.classList.add('hidden');
            submitBtn.disabled = false;
        }
    });
});
</script>
{% endblock %}
