<!-- Navbar -->
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-200/80 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        
        <!-- Brand & Mobile Menu Trigger -->
        <div class="flex items-center space-x-3">
            <button id="mobile-menu-btn" type="button" class="lg:hidden text-gray-500 hover:text-gray-700 p-2 rounded-lg hover:bg-gray-100 transition focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

            <a href="/dashboard/" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-building-columns text-lg"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-gray-900 text-lg leading-tight tracking-tight">G'ulomte Mahalla</span>
                    <span class="text-xs text-indigo-600 font-medium tracking-wide">Aholi Portali</span>
                </div>
            </a>
        </div>

        <!-- Right Side User Menu -->
        <div class="flex items-center space-x-4">
            
            <!-- Anonymous Login Button -->
            <div id="nav-login-link" class="hidden">
                <a href="/login/" class="inline-flex items-center space-x-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl transition shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Tizimga kirish</span>
                </a>
            </div>

            <!-- Authenticated User Profile Menu -->
            <div id="nav-user-info" class="flex items-center space-x-3">
                <div class="hidden sm:flex flex-col text-right">
                    <span class="user-full-name text-sm font-semibold text-gray-800 leading-tight">Foydalanuvchi</span>
                    <span class="user-status-text inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-50 text-emerald-700 self-end mt-0.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span> Faol Hisob
                    </span>
                </div>
                
                <a href="/profile/" class="relative group" title="Mening Profilim">
                    <div class="w-10 h-10 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 font-bold group-hover:bg-indigo-600 group-hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </a>

                <button type="button" class="logout-btn p-2 text-gray-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition" title="Tizimdan chiqish">
                    <i class="fa-solid fa-power-off text-lg"></i>
                </button>
            </div>

        </div>
    </div>
</header>
