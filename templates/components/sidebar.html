<!-- Sidebar Overlay for Mobile -->
<div id="sidebar-overlay" class="fixed inset-0 bg-gray-900/50 backdrop-blur-xs z-40 lg:hidden hidden transition-opacity"></div>

<!-- Sidebar Component -->
<aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200/80 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col justify-between shadow-xl lg:shadow-none">
    
    <!-- Sidebar Navigation Links -->
    <div class="p-4 space-y-6 overflow-y-auto">
        
        <div class="space-y-1">
            <div class="px-3 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">Asosiy Bo'limlar</div>
            
            <!-- Dashboard Link -->
            <a href="/dashboard/" class="sidebar-link flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:text-indigo-600 hover:bg-indigo-50/70 transition group">
                <i class="fa-solid fa-chart-line text-lg text-gray-400 group-hover:text-indigo-600 transition"></i>
                <span>Boshqaruv Paneli</span>
            </a>

            <!-- News Link -->
            <a href="/news/" class="sidebar-link flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:text-indigo-600 hover:bg-indigo-50/70 transition group">
                <i class="fa-solid fa-newspaper text-lg text-gray-400 group-hover:text-indigo-600 transition"></i>
                <span>Yangiliklar</span>
            </a>
        </div>

        <div class="space-y-1">
            <div class="px-3 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">Shaxsiy Kabinet</div>
            
            <!-- Profile Link -->
            <a href="/profile/" class="sidebar-link flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:text-indigo-600 hover:bg-indigo-50/70 transition group">
                <i class="fa-solid fa-id-card text-lg text-gray-400 group-hover:text-indigo-600 transition"></i>
                <span>Mening Profilim</span>
            </a>

            <!-- Edit Profile Link -->
            <a href="/profile/edit/" class="sidebar-link flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:text-indigo-600 hover:bg-indigo-50/70 transition group">
                <i class="fa-solid fa-user-pen text-lg text-gray-400 group-hover:text-indigo-600 transition"></i>
                <span>Profilni Tahrirlash</span>
            </a>

            <!-- Change Password Link -->
            <a href="/profile/change-password/" class="sidebar-link flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:text-indigo-600 hover:bg-indigo-50/70 transition group">
                <i class="fa-solid fa-key text-lg text-gray-400 group-hover:text-indigo-600 transition"></i>
                <span>Parolni O'zgartirish</span>
            </a>
        </div>

        <!-- Community Banner Card -->
        <div class="p-4 bg-gradient-to-br from-indigo-50 to-blue-50 rounded-2xl border border-indigo-100/80">
            <div class="flex items-center space-x-3 mb-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-xs font-bold">
                    <i class="fa-solid fa-house-chimney-window"></i>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-gray-900">G'ulomte Mahalla</h4>
                    <p class="text-[10px] text-gray-500">Aholi xizmati portali</p>
                </div>
            </div>
            <p class="text-xs text-gray-600 leading-relaxed">Mahalla bo'yicha eng so'nggi yangilik va bildirishnomalar bilan tanishib boring.</p>
        </div>

    </div>

    <!-- Bottom Logout Action -->
    <div class="p-4 border-t border-gray-100">
        <button type="button" class="logout-btn w-full flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl text-sm font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 transition">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Tizimdan Chiqish</span>
        </button>
    </div>

</aside>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    const links = document.querySelectorAll('.sidebar-link');
    links.forEach(link => {
        const href = link.getAttribute('href');
        if (currentPath === href || (href !== '/dashboard/' && currentPath.startsWith(href))) {
            link.classList.remove('text-gray-600', 'hover:bg-indigo-50/70');
            link.classList.add('text-indigo-600', 'bg-indigo-50', 'font-bold');
            const icon = link.querySelector('i');
            if (icon) {
                icon.classList.remove('text-gray-400');
                icon.classList.add('text-indigo-600');
            }
        }
    });
});
</script>
